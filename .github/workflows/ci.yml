name: CI Pipeline — KerjaCerdas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"    # LTS; was 20 (deprecated on ubuntu-latest runners)

jobs:
  # ── Gate 1: Code Quality ──────────────────────────────────────────────────
  quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Ruff lint
        # Defers to pyproject.toml: select=["E","F","I","W"], ignore=["E501"]
        run: ruff check backend/app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend lint (ESLint)
        run: cd frontend && npm run lint --if-present || true

  # ── Gate 2: Backend Unit Tests ─────────────────────────────────────────────
  test-unit:
    name: Unit Test Gate
    runs-on: ubuntu-latest
    needs: quality
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""           # HashEmbedder fallback; no real key needed
      # SQLite in-process: avoids needing a Postgres service for pure unit tests.
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        # Includes: pytest, pytest-asyncio, pytest-cov, httpx, aiosqlite, ruff
        run: pip install -e "backend/.[dev]"

      - name: Run unit tests with coverage
        # Run from backend/ so pytest rootdir = backend/ (where pyproject.toml lives).
        # Path tests/unit/ is relative to that rootdir. No testpaths in pyproject.toml.
        run: |
          cd backend
          python -m pytest tests/unit/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            -x
        # 30% is achievable with pure-unit tests and no DB.
        # Raise toward 60%+ once integration mocks / conftest fixtures are added.

  # ── Gate 3: Integration Tests (with Postgres + pgvector) ──────────────────
  test-integration:
    name: Integration Test Gate
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true     # non-blocking until integration tests are written
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kerjacerdas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/kerjacerdas_test
      DEMO_MODE: "false"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Run integration tests
        # Run from backend/ to match rootdir. Exit 5 (no tests) is OK for now.
        run: |
          cd backend
          python -m pytest tests/integration/ -v -x --timeout=30; EC=$?
          if [ $EC -eq 5 ]; then
            echo "No integration tests collected yet — skipping (exit 5 is OK)"
            exit 0
          fi
          exit $EC

  # ── Gate 4: Latency Benchmark (non-blocking, informational) ───────────────
  perf-benchmark:
    name: Latency Benchmark
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true   # warning only; never blocks the pipeline
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""        # Uses HashEmbedder fallback; prints NOT-VALID banner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        # Only core deps needed for the benchmark script
        run: pip install -e "backend/."

      - name: Run matching benchmark
        # Must run as a module from repo root so backend.* imports resolve.
        # HashEmbedder is used (no API key) — benchmark prints a NOT-VALID banner
        # but still completes and shows keyword vs. semantic score distribution.
        run: python -m backend.scripts.benchmark_matching --manual-seconds-per-cv 30
