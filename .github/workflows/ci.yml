name: CI Pipeline — KerjaCerdas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"    # LTS; was 20 (deprecated on ubuntu-latest runners)

jobs:
  # ── Gate 1: Code Quality ──────────────────────────────────────────────────
  quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Ruff lint
        # Uses pyproject.toml rule config — no flags needed.
        # select = ["E","F","I","N","UP","ANN"], line-length = 100
        run: ruff check backend/app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend lint (ESLint)
        run: cd frontend && npm run lint --if-present || true

  # ── Gate 2: Backend Unit Tests ─────────────────────────────────────────────
  test-unit:
    name: Unit Test Gate
    runs-on: ubuntu-latest
    needs: quality
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""           # tests mock the embedder; no real key needed
      # SQLite in-process: avoids needing a Postgres service for pure unit tests.
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Run unit tests with coverage
        # Run from backend/ so pytest rootdir matches where pyproject.toml lives.
        # testpaths is intentionally absent from pyproject.toml — path is passed explicitly.
        run: |
          cd backend
          python -m pytest tests/unit/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            -x
        # Coverage target is 30% — realistic for unit-only tests without a live DB.
        # Raise gradually as integration mocks are added.


  # ── Gate 3: Integration Tests (with Postgres) ──────────────────────────────
  test-integration:
    name: Integration Test Gate
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kerjacerdas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/kerjacerdas_test
      DEMO_MODE: "false"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        run: pip install -e "backend/.[dev]"

      - name: Run integration tests
        run: |
          python -m pytest backend/tests/integration/ -v -x --timeout=30 \
            || echo "No integration tests yet — skipping"

  # ── Gate 4: Latency Benchmark (non-blocking, informational) ───────────────
  perf-benchmark:
    name: Latency Benchmark
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true   # warning only; never blocks the pipeline
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        run: pip install -e "backend/."

      - name: Run matching benchmark
        run: python backend/scripts/benchmark_matching.py || true
