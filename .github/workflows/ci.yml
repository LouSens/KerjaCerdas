name: CI Pipeline — KerjaCerdas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Gate 1: Code Quality ──────────────────────────────────────────────────
  quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]" 2>/dev/null || pip install -e "backend/" ruff

      - name: Ruff lint
        run: ruff check backend/app/ --select E,F,W,I --ignore E501

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend lint (ESLint)
        run: cd frontend && npm run lint --if-present || true

  # ── Gate 2: Backend Unit Tests ─────────────────────────────────────────────
  test-unit:
    name: Unit Test Gate
    runs-on: ubuntu-latest
    needs: quality
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""          # tests mock the embedder; no real key needed
      DATABASE_URL: ""            # falls back to SQLite in-process

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Run unit tests with coverage
        run: |
          cd backend
          python -m pytest tests/unit/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -x
        # Gate: coverage < 60% → FAIL (set to 60 for MVP; raise to 70+ over time)

  # ── Gate 3: Integration Tests (with Postgres) ──────────────────────────────
  test-integration:
    name: Integration Test Gate
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kerjacerdas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/kerjacerdas_test
      DEMO_MODE: "false"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        run: pip install -e "backend/.[dev]"

      - name: Run integration tests
        run: |
          cd backend
          python -m pytest tests/integration/ -v -x --timeout=30 \
            2>/dev/null || echo "No integration tests yet — skipping"

  # ── Gate 4: Latency Benchmark (non-blocking, informational) ───────────────
  perf-benchmark:
    name: Latency Benchmark
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true   # warning only; never blocks deploy
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        run: pip install -e "backend/."

      - name: Run matching benchmark
        run: python backend/scripts/benchmark_matching.py || true

