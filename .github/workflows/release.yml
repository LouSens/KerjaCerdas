# ─────────────────────────────────────────────────────────────────────────────
# Release Pipeline — KerjaCerdas
#
# Triggers   : a version tag pushed to the repo (e.g. git tag v1.2.3 && git push --tags)
# What it does:
#   1. Builds Docker images for backend and frontend
#   2. Pushes them to GitHub Container Registry (ghcr.io) tagged with the version
#   3. Creates a GitHub Release with auto-generated changelog notes
#   4. Runs Alembic migrations against the live Supabase DB
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # matches v1.0.0, v2.3.4, etc.

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/lousens/kerjacerdas-backend
  FRONTEND_IMAGE: ghcr.io/lousens/kerjacerdas-frontend
  PYTHON_VERSION: "3.11"

jobs:
  # ── Step 1: Build and push Docker images ─────────────────────────────────────
  build-and-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 2: Run Alembic migrations on live Supabase DB ───────────────────────
  migrate:
    name: "DB · Apply Migrations to Production"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # requires manual approval in GitHub if configured
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend deps
        run: pip install -e "backend/.[dev]"

      - name: Run Alembic migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

  # ── Step 3: Create GitHub Release ────────────────────────────────────────────
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    permissions:
      contents: write   # required to create releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Create GitHub Release with auto changelog
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Images

            Pull the production images for this release:

            ```bash
            docker pull ghcr.io/lousens/kerjacerdas-backend:${{ github.ref_name }}
            docker pull ghcr.io/lousens/kerjacerdas-frontend:${{ github.ref_name }}
            ```

            ## Deploy

            On your VPS, update `.env` with this version tag and run:

            ```bash
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            ```


