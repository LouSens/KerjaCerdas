# .github/release.yml
# Configures the "Generate release notes" button in the GitHub UI.

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - github-actions[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
    - title: "🛠 Maintenance & CI"
      labels:
        - chore
        - ci
        - refactor
        - docs
    - title: "📦 Other Changes"
      labels:
        - "*"
