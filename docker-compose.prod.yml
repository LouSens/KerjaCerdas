# KerjaCerdas — Docker Compose Production Stack
#
# Images are published to GitHub Container Registry (ghcr.io) by the
# automated release workflow. Pull a specific version by setting IMAGE_TAG:
#
#   IMAGE_TAG=v1.2.3 docker-compose -f docker-compose.prod.yml up -d
#
# Or use `latest` (default) for the most recent release:
#
#   docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d
#
# Required secrets in .env:
#   DATABASE_URL   — Supabase pooler connection string
#   GEMINI_API_KEY — Google Gemini API key
#   JWT_SECRET_KEY — Random 32-byte hex: openssl rand -hex 32
#   PROD_API_URL   — Public URL of the API (e.g. http://YOUR_VPS_IP:8000)
#   CORS_ALLOW_ORIGINS — JSON array of allowed origins (e.g. '["https://yourdomain.com"]')
#
# Two ways to reach the API, and they need different rate-limiter config:
#
#   1. Browser calls the API directly (the default: PROD_API_URL unset, so
#      VITE_API_URL falls back to http://localhost:8000). The backend sees
#      each browser's own real IP as request.client.host, so the rate
#      limiter's default (nothing trusted, X-Real-IP never read) is already
#      correct — leave PROXY_SHARED_SECRET unset.
#
#   2. Browser calls through the Nginx frontend instead — set PROD_API_URL
#      to the frontend's own public URL so the SPA hits its /api/ location
#      (nginx.conf.template), which proxies to the api service and forwards
#      X-Real-IP. Left at its default (empty) here, every proxied client
#      shares one rate-limit bucket keyed by Nginx's own peer address —
#      safe, but under-counts distinct clients. To fix that, set
#      PROXY_SHARED_SECRET to the same random value in BOTH services below
#      (`openssl rand -hex 32`): Nginx then sends it on every proxied
#      request, and the API only trusts X-Real-IP when that secret is
#      present. This is deliberately NOT an IP/CIDR allowlist — `api` also
#      publishes port 8000 straight to the internet below, and depending on
#      the host's Docker/iptables setup, traffic arriving through a
#      published port can appear to originate from inside the container
#      network's own subnet (Docker hairpin/NAT), so an address-based
#      allowlist can't reliably tell "came through our Nginx" from "hit the
#      API directly" — a secret only Nginx knows can, regardless of what
#      address the connection appears to come from.

networks:
  api_net: {}

services:
  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/kerjacerdas-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - api_net
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      # This DATABASE_URL must point to your Supabase pooler URL
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BAND_STRONG_THRESHOLD: ${BAND_STRONG_THRESHOLD:-0.65}
      BAND_POSSIBLE_THRESHOLD: ${BAND_POSSIBLE_THRESHOLD:-0.45}
      # Empty by default — X-Real-IP is never trusted. See the header
      # comment above: set this to the same value as `frontend`'s below
      # only once you're actually routing browser traffic through Nginx.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/kerjacerdas-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - api_net
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      VITE_API_URL: ${PROD_API_URL:-http://localhost:8000}
      # Substituted into nginx.conf.template's X-Internal-Proxy-Secret
      # header. Must match `api`'s PROXY_SHARED_SECRET above exactly.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
