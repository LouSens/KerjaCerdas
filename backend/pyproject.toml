[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "kerjacerdas"
version = "0.3.0"
description = "AI-Powered Job Matching Platform for Indonesia"
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    # PDF text extraction
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=0.0.17",
    # AI / agents
    "google-genai>=1.0.0",
    # Pin to the 1.2.x line: the 1.0.x window shipped a broken core/prebuilt
    # combo where langgraph-prebuilt imports `ExecutionInfo` from
    # `langgraph.runtime` but the matching core release doesn't export it,
    # 500-ing every agent invocation. Keep prebuilt aligned with core.
    "langgraph>=1.2.0",
    "langgraph-prebuilt>=1.1.0",
    "langchain-core>=1.3.0",
    "langchain-google-genai>=4.0.0",
    # Observability
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E=pycodestyle, F=pyflakes, I=isort, W=warnings, N=naming, UP=pyupgrade
# ANN removed: enforcing type annotations on all functions is too strict for this stage.
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter, not linter

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Paths are relative to repo root (where pytest is invoked from in CI)
testpaths = ["backend/tests"]
