# KerjaCerdas — Docker Compose Stack (MVP V2)
# Usage: docker-compose up --build (requires Docker Desktop running)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
